services:
  postgres:
    image: postgres:17-alpine
    container_name: blockpress-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: blockpress
      POSTGRES_PASSWORD: blockpress
      POSTGRES_DB: blockpress
    # Host 5433 → container 5432 (avoids clashing with a host Postgres on 5432).
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blockpress -d blockpress"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: blockpress-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # Allow browser PUTs to presigned URLs from the Vite dev origin (and any origin in dev).
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # One-shot: create the bucket and make it publicly readable so <img src> works.
  minio-init:
    image: minio/mc:latest
    container_name: blockpress-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do echo 'waiting for minio...'; sleep 2; done;
      mc mb --ignore-existing local/blockpress;
      mc anonymous set download local/blockpress;
      echo 'minio bucket [blockpress] ready (public-read)';
      "

  # ───────────────────────────────────────────────────────────────────────────
  # Application containers (hot-reload dev). Opt-in via `--profile apps` so the
  # default `docker compose up` / `pnpm infra:up` stays infra-only.
  # ───────────────────────────────────────────────────────────────────────────

  # One-shot: apply migrations + seed demo content, then exit.
  app-init:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: blockpress-app-init
    working_dir: /app/apps/api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://blockpress:blockpress@postgres:5432/blockpress?schema=public"
    command: >
      sh -c "pnpm exec prisma migrate deploy && pnpm exec ts-node prisma/seed.ts"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/web/node_modules
      - /app/apps/extractor/node_modules
      - /app/packages/shared/node_modules
    restart: "no"

  api:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: blockpress-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      app-init:
        condition: service_completed_successfully
    # Env set explicitly here (authoritative) — we bypass the dotenv-wrapped npm
    # script so the container never reads the host-targeted ../../.env.
    # DATABASE_URL → internal postgres:5432. S3 URLs stay localhost: presigning is
    # offline (no API→MinIO connection) and the URLs are used by the browser.
    environment:
      DATABASE_URL: "postgresql://blockpress:blockpress@postgres:5432/blockpress?schema=public"
      JWT_ACCESS_SECRET: "dev-only-access-secret-change-me-0123456789abcdef"
      JWT_REFRESH_SECRET: "dev-only-refresh-secret-change-me-0123456789abcdef"
      JWT_ACCESS_TTL: "15m"
      JWT_REFRESH_TTL: "7d"
      MOBILE_APP_SECRET: "dev-only-mobile-app-secret-change-me-0123456789abcdef"
      API_PORT: "3001"
      WEB_ORIGIN: "http://localhost:5173"
      S3_ENDPOINT: "http://localhost:9000"
      S3_REGION: "us-east-1"
      S3_BUCKET: "blockpress"
      S3_ACCESS_KEY: "minioadmin"
      S3_SECRET_KEY: "minioadmin"
      S3_FORCE_PATH_STYLE: "true"
      S3_PUBLIC_URL: "http://localhost:9000/blockpress"
    command: pnpm --filter @blockpress/api exec nest start --watch
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/web/node_modules
      - /app/apps/extractor/node_modules
      - /app/packages/shared/node_modules

  web:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: blockpress-web
    restart: unless-stopped
    depends_on:
      - api
    # VITE_API_URL is unset on purpose — the client falls back to
    # http://localhost:3001 (api.ts), which the browser reaches via the published
    # port. Vite must bind 0.0.0.0 to be reachable from the host.
    command: pnpm --filter @blockpress/web exec vite --host 0.0.0.0 --port 5173
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/web/node_modules
      - /app/apps/extractor/node_modules
      - /app/packages/shared/node_modules

volumes:
  pgdata:
  miniodata:
