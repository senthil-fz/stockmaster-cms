services:
  postgres:
    image: postgres:17-alpine
    container_name: stockmaster-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stockmaster
      POSTGRES_PASSWORD: stockmaster
      POSTGRES_DB: stockmaster
    # Host 5433 → container 5432 (avoids clashing with a host Postgres on 5432).
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockmaster -d stockmaster"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ───────────────────────────────────────────────────────────────────────────
  # Application containers (hot-reload dev). Opt-in via `--profile apps` so the
  # default `docker compose up` / `pnpm infra:up` stays infra-only.
  # ───────────────────────────────────────────────────────────────────────────

  # One-shot: apply migrations + seed demo content, then exit.
  app-init:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: stockmaster-app-init
    working_dir: /app/apps/api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://stockmaster:stockmaster@postgres:5432/stockmaster?schema=public"
    command: >
      sh -c "pnpm exec prisma generate && pnpm exec prisma migrate deploy && pnpm exec ts-node prisma/seed.ts"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/web/node_modules
      - /app/apps/extractor/node_modules
      - /app/packages/shared/node_modules
    restart: "no"

  api:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: stockmaster-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      app-init:
        condition: service_completed_successfully
    # Env set explicitly here (authoritative) — we bypass the dotenv-wrapped npm
    # script so the container never reads the host-targeted ../../.env.
    # DATABASE_URL → internal postgres:5432. Uploaded images are stored on disk
    # (UPLOADS_DIR, a named volume) and served at PUBLIC_API_URL/uploads/*.
    environment:
      DATABASE_URL: "postgresql://stockmaster:stockmaster@postgres:5432/stockmaster?schema=public"
      JWT_ACCESS_SECRET: "dev-only-access-secret-change-me-0123456789abcdef"
      JWT_REFRESH_SECRET: "dev-only-refresh-secret-change-me-0123456789abcdef"
      JWT_ACCESS_TTL: "15m"
      JWT_REFRESH_TTL: "7d"
      MOBILE_APP_SECRET: "dev-only-mobile-app-secret-change-me-0123456789abcdef"
      API_PORT: "3001"
      WEB_ORIGIN: "http://localhost:5173"
      UPLOADS_DIR: "/data/uploads"
      PUBLIC_API_URL: "http://localhost:3001"
    command: pnpm --filter @stockmaster/api exec nest start --watch
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/web/node_modules
      - /app/apps/extractor/node_modules
      - /app/packages/shared/node_modules
      - uploads:/data/uploads

  web:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: stockmaster-web
    restart: unless-stopped
    depends_on:
      - api
    # VITE_API_URL is unset on purpose — the client falls back to
    # http://localhost:3001 (api.ts), which the browser reaches via the published
    # port. Vite must bind 0.0.0.0 to be reachable from the host.
    command: pnpm --filter @stockmaster/web exec vite --host 0.0.0.0 --port 5173
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/web/node_modules
      - /app/apps/extractor/node_modules
      - /app/packages/shared/node_modules

  # Draft-only MCP server over Streamable HTTP (POST /mcp). Reaches the API on the
  # internal compose network (api:3001). It holds NO API key — each client presents
  # its own draft-only key as `Authorization: Bearer <bp_key>`, which the server
  # forwards to the API (so a connection can only create/edit drafts, never publish/delete).
  mcp:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: stockmaster-mcp
    restart: unless-stopped
    depends_on:
      - api
    environment:
      STOCKMASTER_API_URL: "http://api:3001"
      MCP_HTTP_PORT: "3002"
      # Set MCP_ALLOWED_HOSTS (comma-separated) to enable DNS-rebinding protection
      # when fronting this with a public domain, e.g. MCP_ALLOWED_HOSTS=mcp.example.com
    command: sh -c "pnpm --filter @stockmaster/mcp build && node /app/apps/mcp/dist/server.js"
    ports:
      - "3002:3002"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/web/node_modules
      - /app/apps/extractor/node_modules
      - /app/packages/shared/node_modules
      - /app/apps/mcp/node_modules
      - /app/packages/editor-schema/node_modules

volumes:
  pgdata:
  uploads:
