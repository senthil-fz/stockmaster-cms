# api.laabam.in — reverse proxy to the NestJS API (PM2, 127.0.0.1:3001).
# Installed HTTP-only; `certbot --nginx` rewrites this to add the 443 block and
# the 80->443 redirect.
server {
    listen 80;
    server_name api.laabam.in;

    access_log /var/log/nginx/api.laabam.in_access.log combined;
    error_log  /var/log/nginx/api.laabam.in_error.log;

    # CMS image uploads go through the API; nginx default body limit is 1m -> 413.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
