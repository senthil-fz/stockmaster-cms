# app.stockmasternagaraj.com — static Vite SPA. NOT a reverse proxy.
# Installed HTTP-only; `certbot --nginx` rewrites this to add the 443 block and
# the 80->443 redirect.
server {
    listen 80;
    server_name app.stockmasternagaraj.com;

    root /var/www/app.stockmasternagaraj.com;
    index index.html;

    access_log /var/log/nginx/app.stockmasternagaraj.com_access.log combined;
    error_log  /var/log/nginx/app.stockmasternagaraj.com_error.log;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Hashed build assets — safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: unknown paths serve index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached (it references the hashed assets).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
