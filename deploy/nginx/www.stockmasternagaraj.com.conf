# www.stockmasternagaraj.com — static Astro marketing site.
# Installed HTTP-only; `certbot --nginx -d www.stockmasternagaraj.com -d stockmasternagaraj.com`
# rewrites this to add the 443 blocks and the 80->443 redirects.

# Apex -> www (canonical host).
server {
    listen 80;
    server_name stockmasternagaraj.com;
    return 301 https://www.stockmasternagaraj.com$request_uri;
}

server {
    listen 80;
    server_name www.stockmasternagaraj.com;

    root /var/www/www.stockmasternagaraj.com;
    index index.html;

    access_log /var/log/nginx/www.stockmasternagaraj.com_access.log combined;
    error_log  /var/log/nginx/www.stockmasternagaraj.com_error.log;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Astro hashed build assets — safe to cache forever.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Uploaded media (logos, screenshots, book covers).
    location /uploads/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Static multi-page site: serve the file, the pretty-url directory
    # (e.g. /privacy -> /privacy/index.html), or its .html, else 404.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # index.html must never be cached (it references the hashed assets).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
